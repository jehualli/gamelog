{{define "content"}}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/games/{{.Game.ID}}" class="text-gray-500 hover:text-white text-sm transition-colors">← {{.Game.Title}}</a>
    <span class="text-gray-700">/</span>
    <h1 class="text-2xl font-bold">Edit Game</h1>
  </div>

  <div class="card p-6 rounded-2xl">
    <form method="POST" action="/games/{{.Game.ID}}/update" enctype="multipart/form-data" class="space-y-5">

      <div class="grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm text-gray-400 mb-1">Game Title <span class="text-red-400">*</span></label>
          <input class="input" type="text" name="title" required value="{{.Game.Title}}">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Platform</label>
          <select class="input" name="platform">
            <option value="">Select platform</option>
            {{$p := .Game.Platform}}
            <option {{if eq $p "PC"}}selected{{end}}>PC</option>
            <option {{if eq $p "PlayStation 5"}}selected{{end}}>PlayStation 5</option>
            <option {{if eq $p "PlayStation 4"}}selected{{end}}>PlayStation 4</option>
            <option {{if eq $p "Xbox Series X"}}selected{{end}}>Xbox Series X</option>
            <option {{if eq $p "Xbox One"}}selected{{end}}>Xbox One</option>
            <option {{if eq $p "Nintendo Switch"}}selected{{end}}>Nintendo Switch</option>
            <option {{if eq $p "Mobile"}}selected{{end}}>Mobile</option>
            <option {{if eq $p "Other"}}selected{{end}}>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Genre</label>
          <input class="input" type="text" name="genre" value="{{.Game.Genre}}">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Status</label>
          <select class="input" name="status">
            {{$s := .Game.Status}}
            <option value="playing" {{if eq $s "playing"}}selected{{end}}>🎮 Playing</option>
            <option value="backlog" {{if eq $s "backlog"}}selected{{end}}>📋 Backlog</option>
            <option value="paused" {{if eq $s "paused"}}selected{{end}}>⏸ Paused</option>
            <option value="completed" {{if eq $s "completed"}}selected{{end}}>✅ Completed</option>
            <option value="dropped" {{if eq $s "dropped"}}selected{{end}}>🗑 Dropped</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Rating</label>
          <input class="input" type="number" name="rating" min="0" max="10" value="{{.Game.Rating}}">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Notes</label>
        <textarea class="input" name="notes" rows="3">{{.Game.Notes}}</textarea>
      </div>

      {{if .CloudinaryEnabled}}
      <div>
        <label class="block text-sm text-gray-400 mb-1">
          Replace Cover Image
          {{if .Game.CoverURL}}<span class="text-gray-600 text-xs">(leave empty to keep current)</span>{{end}}
        </label>
        {{if .Game.CoverURL}}
        <img src="{{.Game.CoverURL}}" alt="current cover" class="h-16 rounded mb-2 border border-gray-700">
        {{end}}
        <input class="input py-2" type="file" name="cover_image" accept="image/*">
      </div>
      {{end}}

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary px-8 py-2.5">Save Changes</button>
        <a href="/games/{{.Game.ID}}" class="btn-ghost px-6 py-2.5">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}
