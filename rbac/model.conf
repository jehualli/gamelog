# LEARN — Casbin Model File
# This file defines the STRUCTURE of the access control model.
# It tells Casbin: "what does a request look like, what does a policy look like,
# how do roles work, and how do we decide if access is granted?"

# A request has two fields: the role (who) and the action (what)
[request_definition]
r = sub, act

# A policy row has two fields: the allowed role and the allowed action
[policy_definition]
p = sub, act

# Role inheritance: g = _, _ means "role A can inherit role B's permissions"
# This lets us write: admin inherits all of player's permissions
[role_definition]
g = _, _

# Access is granted if ANY matching policy row has effect "allow"
[policy_effect]
e = some(where (p.eft == allow))

# The matcher: the request subject's role (via g) must match a policy subject,
# AND the action must match exactly.
# g(r.sub, p.sub) performs role-aware matching (respects inheritance).
[matchers]
m = g(r.sub, p.sub) && r.act == p.act
